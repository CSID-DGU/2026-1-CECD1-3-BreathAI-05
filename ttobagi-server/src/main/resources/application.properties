spring.config.import=optional:file:.env[.properties]

spring.application.name=ttobagi-server

# DB 연결 정보
spring.datasource.url=${TTOBAGI_DB_URL}
spring.datasource.username=${TTOBAGI_DB_USERNAME}
spring.datasource.password=${TTOBAGI_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true