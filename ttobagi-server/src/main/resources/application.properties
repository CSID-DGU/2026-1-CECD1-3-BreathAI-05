spring.config.import=optional:file:.env[.properties]

spring.application.name=ttobagi-server

# DB 연결 정보
spring.datasource.url=${TTOBAGI_DB_URL}
spring.datasource.username=${TTOBAGI_DB_USERNAME}
spring.datasource.password=${TTOBAGI_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AI 서버 연결 정보
# 로컬 개발 기본값: FastAPI 서버가 http://localhost:8000 에서 실행된다고 가정
ai.server.base-url=${AI_SERVER_BASE_URL:http://localhost:8000}

# 파일 업로드 제한
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB